<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HVACR Field Quote</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #121212;
    color: #f0f0f0;
    margin: 0;
    padding: 16px;
    font-size: 17px;
  }
  h2 { margin: 0 0 12px 0; color: #4da3ff; font-size: 22px; }
  .section {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #4da3ff;
    font-weight: bold;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  label {
    display: block;
    margin-top: 10px;
    margin-bottom: 4px;
    font-size: 14px;
    color: #bbb;
  }
  input[type="text"], input[type="number"], textarea.findings {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #242424;
    color: #fff;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn-paste {
    background: #0d47a1; color: #fff; border: 1px solid #2196f3;
    border-radius: 8px; padding: 12px; width: 100%; font-size: 16px;
    font-weight: bold; cursor: pointer; margin-bottom: 8px;
  }
  .btn-vendor {
    background: #1565c0; color: #fff; border: 1px solid #42a5f5;
    border-radius: 8px; padding: 14px; width: 100%; font-size: 15px;
    font-weight: bold; cursor: pointer;
  }
  .paste-status { font-size: 14px; color: #8ce99a; min-height: 20px; margin-bottom: 6px; }
  .item-row {
    position: relative; display: flex; gap: 6px; align-items: center;
    background: #242424; padding: 8px; border-radius: 8px;
    margin-bottom: 8px; border: 1px solid #383838; flex-wrap: wrap;
  }
  .item-row input.qty { width: 64px; text-align: center; font-weight: bold; background: #181818; }
  .item-row input.code { flex: 1; min-width: 130px; text-transform: uppercase; }
  .vendor-row input.v-qty { width: 60px; text-align: center; font-weight: bold; background: #181818; }
  .vendor-row input.v-desc { flex: 1.3; min-width: 130px; text-transform: uppercase; }
  .vendor-row input.v-part { flex: 1; min-width: 105px; text-transform: uppercase; }
  .vendor-row input.v-price { width: 85px; }
  .vendor-row input.v-vendor { flex: 1; min-width: 100px; }
  .search-dropdown {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 99;
    background: #1e272e; border: 1px solid #4da3ff; border-radius: 8px;
    max-height: 200px; overflow-y: auto; box-shadow: 0 6px 16px rgba(0,0,0,0.7);
  }
  .search-option {
    padding: 10px 12px; border-bottom: 1px solid #333; cursor: pointer; font-size: 15px;
  }
  .search-option:hover { background: #0d47a1; }
  .search-option strong { color: #4da3ff; }
  .btn-remove {
    background: #b3261e; color: white; border: none; border-radius: 6px;
    padding: 10px 12px; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  .btn-add {
    background: #2b5b84; color: white; border: none; border-radius: 6px;
    padding: 8px 12px; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .pill-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .batch-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: #263238; color: #8ce99a; border: 1px solid #4caf50;
    border-radius: 20px; padding: 6px 12px; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .batch-pill.editing { background: #e65100; color: #fff; border-color: #ff9800; }
  .pill-del {
    background: rgba(255,255,255,0.15); color: #ff8a80; border-radius: 50%;
    width: 20px; height: 20px; display: inline-flex; align-items: center;
    justify-content: center; font-size: 13px; line-height: 1;
  }
  .pill-del:hover { background: #b3261e; color: #fff; }

    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .btn-primary {
    background: #2e7d32; color: white; border: none; border-radius: 8px;
    padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer;
  }
  .btn-secondary {
    background: #2c2c2c; color: #fff; border: 1px solid #555; border-radius: 8px;
    padding: 13px; font-size: 16px; font-weight: bold; cursor: pointer;
  }
  textarea.output-box {
    width: 100%; height: 270px; background: #000; border: 1px solid #333;
    padding: 12px; border-radius: 8px; font-size: 14px; color: #8ce99a;
    margin-top: 16px; box-sizing: border-box; font-family: monospace;
  }
  .cat-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .cat-pill {
    background: #1e272e; color: #4da3ff; border: 1px solid #2b5b84;
    border-radius: 16px; padding: 6px 12px; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .cat-pill:hover, .cat-pill.active { background: #0d47a1; color: #fff; border-color: #4da3ff; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-box {
    background: #1a1a1a; border: 1px solid #4da3ff; border-radius: 12px;
    width: 100%; max-width: 480px; max-height: 80vh; display: flex; flex-direction: column; padding: 16px;
  }
  .modal-list { overflow-y: auto; flex: 1; margin: 10px 0; display: flex; flex-direction: column; gap: 8px; }
  .modal-item {
    display: flex; align-items: center; gap: 10px; background: #242424;
    padding: 10px 12px; border-radius: 8px; border: 1px solid #383838; cursor: pointer;
  }
  .modal-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: #4da3ff; }
</style>
</style>
</head>
<body>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <h2 style="margin:0;">HVACR Field Quote</h2>
    <button type="button" class="btn-remove" style="font-size:14px; padding:8px 12px;" onclick="confirmNewJob()">New Job / Clear</button>
  </div>


  <!-- SMART PASTE BAR -->
  <button type="button" class="btn-paste" onclick="smartPaste()">Paste Copied Info (Cust or Equip)</button>
  <div id="paste-status" class="paste-status"></div>
  <textarea id="manual-paste" rows="2" placeholder="Or click here & press Ctrl+V to paste..." oninput="parseText(this.value); this.value='';" style="margin-bottom:14px; font-size:15px; padding:10px;"></textarea>

  <!-- 1. CUSTOMER INFO -->
  <div class="section">
    <div class="section-title">1. Customer Info</div>
    <div class="grid-2">
      <div>
        <label for="wo">Work Order #</label>
        <input type="text" id="wo" placeholder="e.g. 4656412">
      </div>
      <div>
        <label for="po">Cust PO #</label>
        <input type="text" id="po" placeholder="e.g. 363890230">
      </div>
    </div>
    <label for="cust">Customer / Site</label>
    <input type="text" id="cust" placeholder="e.g. WACO012410 - WALGREENS 12410">
    <label for="addr">Address & Unit Location</label>
    <input type="text" id="addr" placeholder="Address / Service Area / Unit Tag">
  </div>
  
    <!-- 2. EQUIPMENT INFO -->
  <div class="section">
    <div class="section-title">2. Equipment Info</div>
    <div class="grid-2">
      <div>
        <label for="unitTag">Unit #</label>
        <input type="text" id="unitTag" placeholder="e.g. RTU-1, AC-2, WIC">
      </div>
      <div>
        <label for="brand">Make / Brand</label>
        <input type="text" id="brand" placeholder="e.g. LENNOX">
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label for="year">Year</label>
        <input type="text" id="year" placeholder="e.g. 2012">
      </div>
      <div>
        <label for="equipDesc">Equipment Description</label>
        <input type="text" id="equipDesc" placeholder="e.g. PACKAGE UNIT">
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label for="model">Model #</label>
        <input type="text" id="model" placeholder="Model Number">
      </div>
      <div>
        <label for="serial">Serial #</label>
        <input type="text" id="serial" placeholder="Serial Number">
      </div>
    </div>
  </div>

  
  
  <!-- 3. DESCRIPTION OF FINDINGS -->
  <div class="section">
    <div class="section-title">3. Description of Findings</div>
    <textarea id="desc" class="findings" rows="2" placeholder="Type: needs new compressor or txv..." oninput="checkKeywords()"></textarea>

      <div style="margin-top: 10px;">
      <label for="laborNotes">Labor / Crane / Special Notes (Office Email)</label>
      <input type="text" id="laborNotes" placeholder="e.g. 2 techs 8 hrs each, Crane needed 30 ft up 35 ft over">
    </div>


    <!-- A. TRUCK STOCK LIST -->
    <div class="section-title" style="margin-top: 16px; color: #ddd;">
      <span>Truck Stock (Search by Name or Code)</span>
      <button type="button" class="btn-add" onclick="addStockRow('', '')">+ Add Stock</button>
    </div>
    <div id="stock-category-bar" class="cat-bar"></div>
    <div id="stock-container"></div>

    <!-- B. NON-STOCK / VENDOR PARTS -->
    <div class="section-title" style="margin-top: 18px; color: #ffcc80;">
      <span>Non-Stock / Vendor Parts</span>
      <button type="button" class="btn-add" style="background:#8d5524;" onclick="addVendorRow('', '', '', '','')">+ Add Vendor Part</button>
    </div>
    <div id="vendor-parts-container"></div>
  </div>

    <!-- MULTI-UNIT BATCH BAR -->
  <div class="section" style="border-color: #2b5b84;">
    <div class="section-title" style="margin-bottom: 6px;">Multi-Unit Batch</div>
    <div class="grid-2">
      <button type="button" class="btn-add" id="btn-batch-action" style="padding: 12px; font-size: 15px;" onclick="saveUnitToBatch()">+ Add Unit to Batch</button>
      <button type="button" class="btn-secondary" id="btn-clear-batch" style="padding: 12px; font-size: 15px;" onclick="clearBatch()">Clear All</button>
    </div>
    <div id="batch-pills" class="pill-bar"></div>
    <div id="batch-status" class="paste-status" style="margin-top: 8px;">Batch: 0 units (will send current unit)</div>
  </div>

    <div id="batch-pills" class="pill-bar"></div>
    <div id="batch-status" class="paste-status" style="margin-top: 8px;">Batch: 0 units (will send current unit)</div>
  </div>

  <div class="actions">
    <div id="vendor-buttons-container" style="display:flex; flex-direction:column; gap:10px;"></div>
    <button type="button" class="btn-vendor" id="btn-email-office" style="background:#00695c; border-color:#26a69a;" onclick="emailOffice()">Email Quote to Office</button>
    <button type="button" class="btn-primary" onclick="generateOutput()">Generate Quote & Copy</button>
    <button type="button" class="btn-secondary" onclick="downloadFile()">Save .TXT File (For OneDrive)</button>
  </div>

  <textarea id="output" class="output-box" style="display:none;" readonly></textarea>
    <div id="stock-modal" class="modal-backdrop" style="display:none;" onclick="if(event.target===this) closeStockModal()">
    <div class="modal-box">
      <div class="section-title" style="margin:0;">
        <span id="stock-modal-title">Select Parts</span>
        <button type="button" class="btn-remove" style="padding:6px 10px;" onclick="closeStockModal()">X</button>
      </div>
      <div id="stock-modal-list" class="modal-list"></div>
      <button type="button" class="btn-primary" id="btn-add-selected-stock" onclick="confirmStockModal()">Add Selected (0)</button>
    </div>
  </div>

  <script src="inventory.js"></script>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
