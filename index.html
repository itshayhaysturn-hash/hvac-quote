<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HVACR Field Quote</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #121212;
    color: #f0f0f0;
    margin: 0;
    padding: 16px;
    font-size: 17px;
  }
  h2 { margin: 0 0 12px 0; color: #4da3ff; font-size: 22px; }
  .section {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #4da3ff;
    font-weight: bold;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  label {
    display: block;
    margin-top: 10px;
    margin-bottom: 4px;
    font-size: 14px;
    color: #bbb;
  }
  input[type="text"], input[type="number"], textarea.findings {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    font-size: 17px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #242424;
    color: #fff;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .btn-paste {
    background: #0d47a1;
    color: #fff;
    border: 1px solid #2196f3;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .btn-vendor {
    background: #1565c0;
    color: #fff;
    border: 1px solid #42a5f5;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 12px;
  }
  .paste-status {
    font-size: 14px;
    color: #8ce99a;
    min-height: 20px;
    margin-bottom: 6px;
  }
  .item-row {
    display: flex;
    gap: 8px;
    align-items: center;
    background: #242424;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 8px;
    border: 1px solid #383838;
  }
  .item-row input[type="number"] {
    width: 72px;
    text-align: center;
    padding: 10px;
    font-weight: bold;
    background: #181818;
  }
  .item-row input[type="text"] {
    flex: 1;
    padding: 10px;
    text-transform: uppercase;
  }
  .btn-remove {
    background: #b3261e;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 13px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-add {
    background: #2b5b84;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .btn-primary {
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-secondary {
    background: #2c2c2c;
    color: #fff;
    border: 1px solid #555;
    border-radius: 8px;
    padding: 13px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  textarea.output-box {
    width: 100%;
    height: 270px;
    background: #000;
    border: 1px solid #333;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    color: #8ce99a;
    margin-top: 16px;
    box-sizing: border-box;
    font-family: monospace;
  }
</style>
</head>
<body>

  <h2>HVACR Field Quote</h2>

  <!-- SMART PASTE BAR -->
  <button type="button" class="btn-paste" onclick="smartPaste()">Paste Copied Info (Cust or Equip)</button>
  <div id="paste-status" class="paste-status"></div>
  <textarea id="manual-paste" rows="2" placeholder="Or click here & press Ctrl+V to paste..." oninput="parseText(this.value); this.value='';" style="width:100%; box-sizing:border-box; border-radius:8px; border:1px solid #444; background:#242424; color:#fff; margin-bottom:14px; font-size:15px; padding:10px;"></textarea>

  <!-- 1. CUSTOMER INFO -->
  <div class="section">
    <div class="section-title">1. Customer Info</div>
    <div class="grid-2">
      <div>
        <label for="wo">Work Order #</label>
        <input type="text" id="wo" placeholder="e.g. 4656412">
      </div>
      <div>
        <label for="po">Cust PO #</label>
        <input type="text" id="po" placeholder="e.g. 363890230">
      </div>
    </div>
    <label for="cust">Customer / Site</label>
    <input type="text" id="cust" placeholder="e.g. WACO012410 - WALGREENS 12410">
    <label for="addr">Address & Unit Location</label>
    <input type="text" id="addr" placeholder="Address / Service Area / Unit Tag">
  </div>

  <!-- 2. EQUIPMENT INFO -->
  <div class="section">
    <div class="section-title">2. Equipment Info</div>
    <div class="grid-2">
      <div>
        <label for="brand">Make / Brand</label>
        <input type="text" id="brand" placeholder="e.g. LENNOX">
      </div>
      <div>
        <label for="year">Year</label>
        <input type="text" id="year" placeholder="e.g. 2012">
      </div>
    </div>
    <label for="equipDesc">Equipment Description</label>
    <input type="text" id="equipDesc" placeholder="e.g. PACKAGE UNIT">
    <div class="grid-2">
      <div>
        <label for="model">Model #</label>
        <input type="text" id="model" placeholder="Model Number">
      </div>
      <div>
        <label for="serial">Serial #</label>
        <input type="text" id="serial" placeholder="Serial Number">
      </div>
    </div>

    <button type="button" class="btn-vendor" onclick="emailVendor()">Email Vendor for Part Price & Availability</button>
  </div>

  <!-- 3. DESCRIPTION OF FINDINGS -->
  <div class="section">
    <div class="section-title">3. Description of Findings</div>
    <textarea id="desc" class="findings" rows="2" placeholder="Type: needs new compressor..." oninput="checkKeywords()"></textarea>

    <div class="section-title" style="margin-top: 16px; color: #ddd;">
      <span>Parts & Truck Stock</span>
      <button type="button" class="btn-add" onclick="addRow('', '')">+ Add Line</button>
    </div>
    <div id="items-container"></div>
  </div>

  <div class="actions">
    <button type="button" class="btn-primary" onclick="generateOutput()">Generate Quote & Copy</button>
    <button type="button" class="btn-secondary" onclick="downloadFile()">Save .TXT File (For OneDrive)</button>
  </div>

  <textarea id="output" class="output-box" style="display:none;" readonly></textarea>

  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
